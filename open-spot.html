<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Open Spot – Book a spot, not a court</title>
<style>
:root{--bg:#0e1a14;--panel:#14241c;--line:#243a2e;--ink:#e6f0e9;--muted:#8fa89a;--g:#3fae72;--o:#ff7a2f;color-scheme:dark}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:'Archivo','Helvetica Neue',Arial,sans-serif;padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0)}
.bar{background:var(--g);color:#06140c;padding:10px 18px;display:flex;justify-content:space-between;align-items:center;font-weight:800;letter-spacing:.04em}
.bar button{border:1.5px solid #06140c;background:none;border-radius:99px;padding:4px 12px;font:700 12px inherit;font-family:inherit;color:#06140c;cursor:pointer}
.hero{padding:22px 18px 8px;max-width:1100px;margin:auto}
h1{font-size:clamp(38px,9vw,84px);line-height:.9;margin:0;font-weight:900;text-transform:uppercase;letter-spacing:-.02em}
h1 s{color:var(--muted);text-decoration-color:var(--o);text-decoration-thickness:6px}
.main{display:grid;grid-template-columns:230px 1fr;gap:20px;max-width:1100px;margin:auto;padding:14px 18px 30px}
@media(max-width:720px){.main{grid-template-columns:1fr}}
.side{background:var(--panel);border-radius:10px;padding:14px;align-self:start}
.side h4{margin:12px 0 6px;font-size:12px;color:var(--muted);font-weight:600}.side h4:first-child{margin-top:0}
.pills{display:flex;gap:6px;flex-wrap:wrap}
.pill{border:1px solid var(--line);background:none;color:var(--ink);border-radius:99px;padding:6px 12px;font:600 12px inherit;font-family:inherit;cursor:pointer}
.pill[aria-pressed=true]{background:var(--g);color:#06140c;border-color:var(--g)}
button:focus-visible{outline:3px solid #fff;outline-offset:2px}
.head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px}.head h2{margin:0;font-size:22px;font-weight:900}.head span{font-size:12px;color:var(--muted)}
.game{width:100%;display:grid;grid-template-columns:70px 1fr auto;gap:14px;align-items:center;background:var(--panel);border:1.5px solid transparent;border-radius:10px;padding:12px 14px;margin-bottom:8px;text-align:left;color:inherit;font-family:inherit;cursor:pointer}
.game:hover,.game.sel{border-color:var(--g)}
.when b{font-size:22px;display:block;line-height:1}.when small{font-size:11px;color:var(--muted)}
.mid b{display:block;font-size:14px}.mid small{color:var(--muted);font-size:12px}
.dots{display:flex;gap:3px;margin-top:6px}.dots i{width:14px;height:14px;border-radius:3px;background:#e6f0e9;display:block}.dots i.e{background:none;border:1.5px solid var(--muted)}
.pr{text-align:right}.pr b{font-size:20px}.pr small{color:var(--muted)}
.tag{display:inline-block;margin-top:4px;font-size:10px;font-weight:700;padding:3px 8px;border-radius:5px;background:#3a2512;color:var(--o)}.tag.g{background:#12361f;color:var(--g)}.tag.w{background:#333;color:#ddd}
.detail{background:var(--panel);border:1.5px solid var(--g);border-radius:10px;padding:16px;margin-bottom:12px}
.detail h3{margin:0 0 2px;font-size:18px}.detail p{margin:2px 0 10px;color:var(--muted);font-size:13px}
.seats{display:flex;gap:6px;margin:10px 0}.seat{flex:1;border:1px solid var(--line);border-radius:8px;padding:8px;text-align:center;font-size:12px}.seat.open{border:1.5px dashed var(--o);color:var(--o)}.seat.you{background:var(--g);color:#06140c;border-color:var(--g);font-weight:800}
.cta{background:var(--o);color:#190a00;border:0;border-radius:8px;padding:12px 22px;font:800 15px inherit;font-family:inherit;cursor:pointer}
.cta.ghost{background:none;border:1.5px solid var(--ink);color:var(--ink);margin-left:6px}
.note{font-size:12px;color:var(--muted);margin-top:10px}
.empty{color:var(--muted);padding:30px;text-align:center;background:var(--panel);border-radius:10px}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head><body>
<div class="bar"><span>OPEN SPOT</span><button id="mine">My spots · 0</button></div>
<div class="hero"><h1>Book a spot.<br><s>Not a court.</s></h1></div>
<div class="main">
 <aside class="side">
  <h4>Sport</h4><div class="pills" id="sport"></div>
  <h4>Your level · NTRP</h4><div class="pills" id="lvl"></div>
  <h4>Borough</h4><div class="pills" id="bor"></div>
  <h4>Time</h4><div class="pills" id="time"></div>
 </aside>
 <section><div class="head"><h2 id="ttl"></h2><span id="cnt"></span></div><div id="detail"></div><div id="list"></div></section>
</div>
<script>
const G=[
{id:1,sp:"Tennis doubles",c:"Central Park Tennis Center · Court 12",b:"Manhattan",d:"Tmrw",t:"6:30",ap:"PM",len:90,lv:3.5,cost:60,n:4,in:3,time:"Evening",hint:"96 St"},
{id:2,sp:"Tennis doubles",c:"Prospect Park Tennis Center",b:"Brooklyn",d:"Tmrw",t:"7:00",ap:"AM",len:60,lv:3.5,cost:120,n:4,in:2,time:"Morning",hint:"Parkside Av"},
{id:3,sp:"Tennis doubles",c:"McCarren Park",b:"Brooklyn",d:"Tue",t:"7:30",ap:"PM",len:90,lv:3.0,cost:48,n:4,in:3,time:"Evening",hint:"Nassau Av"},
{id:4,sp:"Tennis doubles",c:"Riverside Park Courts",b:"Manhattan",d:"Today",t:"12:30",ap:"PM",len:60,lv:3.5,cost:60,n:4,in:3,time:"Midday",hint:"Riverside Dr"},
{id:5,sp:"Tennis doubles",c:"Astoria Park",b:"Queens",d:"Wed",t:"6:00",ap:"PM",len:90,lv:4.0,cost:64,n:4,in:2,time:"Evening",hint:"Shore Blvd"},
{id:6,sp:"Tennis singles",c:"Central Park Tennis Center · Court 4",b:"Manhattan",d:"Tmrw",t:"1:00",ap:"PM",len:60,lv:3.5,cost:30,n:2,in:1,time:"Midday",hint:"96 St"},
{id:7,sp:"Hitting session",c:"Fort Greene Park Courts",b:"Brooklyn",d:"Today",t:"6:00",ap:"PM",len:60,lv:3.0,cost:24,n:2,in:1,time:"Evening",hint:"Myrtle Av"},
{id:8,sp:"Pickleball doubles",c:"Bronx Pickle Club",b:"Bronx",d:"Thu",t:"6:30",ap:"PM",len:60,lv:3.0,cost:40,n:4,in:3,time:"Evening",hint:"Grand Concourse"}];
const sports=["Tennis doubles","Tennis singles","Hitting session","Pickleball doubles"];
const S={sport:"Tennis doubles",lvl:3.5,bor:null,time:null,sel:null};const mine=new Set(),wait=new Set();
const $=id=>document.getElementById(id);
const pill=(a,v,on,k)=>`<button class="pill" aria-pressed="${on}" data-k="${k}" data-v="${v}">${v}</button>`;
const fit=g=>Math.abs(g.lv-S.lvl)<=0.5;
function list(){return G.filter(g=>g.sp==S.sport&&fit(g)&&(!S.bor||g.b==S.bor)&&(!S.time||g.time==S.time))}
function dots(g){const filled=g.in+(mine.has(g.id)?1:0);return Array.from({length:g.n},(_,i)=>`<i class="${i<filled?"":"e"}"></i>`).join("")}
function left(g){return g.n-g.in-(mine.has(g.id)?1:0)}
function share(g){return Math.round(g.cost/g.n)}
function render(){
 $("sport").innerHTML=sports.map(s=>pill(0,s,s==S.sport,"sport")).join("");
 $("lvl").innerHTML=[2.5,3.0,3.5,4.0,4.5].map(l=>`<button class="pill" aria-pressed="${l==S.lvl}" data-k="lvl" data-v="${l}">${l.toFixed(1)}</button>`).join("");
 $("bor").innerHTML=["Manhattan","Brooklyn","Queens","Bronx"].map(b=>pill(0,b,b==S.bor,"bor")).join("");
 $("time").innerHTML=["Morning","Midday","Evening"].map(b=>pill(0,b,b==S.time,"time")).join("");
 $("mine").textContent="My spots · "+mine.size;
 const l=list();$("ttl").textContent=S.sport.toUpperCase();$("cnt").textContent=`${l.length} games · NTRP ${S.lvl.toFixed(1)}`;
 $("list").innerHTML=l.length?l.map(g=>{const r=left(g);const tag=mine.has(g.id)?`<span class="tag g">YOU'RE IN</span>`:wait.has(g.id)?`<span class="tag w">ON WAITLIST</span>`:r==0?`<span class="tag w">FULL · JOIN WAITLIST</span>`:`<span class="tag">${r} SPOT${r>1?"S":""} LEFT</span>`;
 return `<button class="game ${S.sel==g.id?"sel":""}" data-g="${g.id}"><div class="when"><small>${g.d}</small><b>${g.t}</b><small>${g.ap} · ${g.len}m</small></div><div class="mid"><b>${g.c}</b><small>${g.hint} · NTRP ${g.lv.toFixed(1)}</small><div class="dots">${dots(g)}</div></div><div class="pr"><b>$${share(g)}</b><small>/spot</small><br>${tag}</div></button>`}).join(""):`<div class="empty">No games at this level and time. Widen your level or time, or turn on a last-minute alert.</div>`;
 const g=G.find(x=>x.id==S.sel);
 $("detail").innerHTML=g&&l.includes(g)?(()=>{const r=left(g),m=mine.has(g.id);
  return `<div class="detail"><h3>${g.c}</h3><p>${g.d} · ${g.t} ${g.ap} · ${g.len} min · $${g.cost} court ÷ ${g.n} = $${share(g)} each</p>
  <div class="seats">${Array.from({length:g.n},(_,i)=>{const f=i<g.in,y=!f&&m&&i==g.in;return `<div class="seat ${f?"":y?"you":"open"}">${f?"Player "+(i+1):y?"You":"Open"}</div>`}).join("")}</div>
  ${m?`<button class="cta ghost" style="margin:0" data-a="leave">Leave game</button>`:r>0?`<button class="cta" data-a="take">Take a spot · $${share(g)}</button>`:wait.has(g.id)?`<button class="cta ghost" style="margin:0" data-a="unwait">Leave waitlist</button>`:`<button class="cta" data-a="wait">Join waitlist</button>`}
  <button class="cta ghost" data-a="alert">Alert me</button>
  <p class="note">${m?"Confirmed two hours before. If someone bails, the waitlist fills their spot. Split settled at check-in.":"Fee splits automatically at check-in. Confirmation arrives two hours before the game."}</p></div>`})():"";
}
document.addEventListener("click",e=>{
 const b=e.target.closest("[data-k],[data-g],[data-a],#mine");if(!b)return;
 if(b.dataset.k){const k=b.dataset.k,v=k=="lvl"?+b.dataset.v:b.dataset.v;S[k]=(S[k]==v&&(k=="bor"||k=="time"))?null:v;S.sel=null}
 else if(b.dataset.g){S.sel=+b.dataset.g}
 else if(b.id=="mine"){const m=G.filter(g=>mine.has(g.id));alert(m.length?"Your spots:\n"+m.map(g=>`${g.d} ${g.t} ${g.ap} – ${g.c}`).join("\n"):"No spots yet. Pick a game and tap Take a spot.")}
 else{const id=S.sel;const a=b.dataset.a;
  if(a=="take")mine.add(id);else if(a=="leave")mine.delete(id);else if(a=="wait")wait.add(id);else if(a=="unwait")wait.delete(id);
  else if(a=="alert")alert("Alert on. We’ll ping you when a spot opens in the next three hours.")}
 render();
});
render();
</script></body></html>
